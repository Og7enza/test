name: truthcatcher
description: "TruthCatcher — photos infalsifiables : horodatage, géolocalisation, hash SHA-256, matricule unique et mint NFT gas-free sur Polygon."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (sans codegen)
  flutter_riverpod: ^2.5.1

  # Navigation + deeplinks (matricule)
  go_router: ^14.2.7

  # Capture & preuve
  camera: ^0.11.0+2
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  crypto: ^3.0.5            # SHA-256 on-device
  path_provider: ^2.1.4
  path: ^1.9.0
  image_picker: ^1.1.2     # fallback galerie pour la démo (sans caméra)
  image: ^4.2.0            # incrustation (stamp) du matricule sur la photo

  # UI / utilitaires
  google_fonts: ^6.2.1
  intl: ^0.19.0
  share_plus: ^10.0.2
  collection: ^1.18.0
  flutter_staggered_grid_view: ^0.7.0   # galerie masonry (look d'origine)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Icône du launcher (ce qui s'affiche sur le téléphone) = symbole TC.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/tc_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
