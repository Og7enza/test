dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  google_fonts: ^5.1.0
  flutter_svg: ^2.0.7
  iconsax: ^0.0.8
  entry: ^0.0.8+1
  image_picker: ^1.0.4
  intl: ^0.18.1
  geolocator: ^10.0.1
  geocoding: ^2.1.0
  google_sign_in: ^6.1.5
  firebase_core: ^2.16.0
  firebase_auth: ^4.10.0
  provider: ^6.0.5
  fluttertoast: ^8.2.2
  loading_animation_widget: ^1.2.0+4
  email_validator: ^2.1.17
  shimmer: ^3.0.0
  http: ^1.1.0
  liquid_pull_to_refresh: ^3.0.1
  url_launcher: ^6.1.14
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.0
  share_plus: ^7.2.1
  flutter_stripe: ^9.5.0+1
  staggered_grid_view_flutter: ^0.0.4
  vpn_connection_detector: ^1.0.5
  fade_indexed_stack: ^0.2.2
  flutter_windowmanager: ^0.2.0
  secure_application: ^4.0.0
  screen_protector: ^1.4.2
  permission_handler: ^11.3.0
  animated_floating_widget: ^0.0.6
  dio: ^5.4.1
  image_gallery_saver: ^2.0.3
  crypto: ^3.0.3
  sign_in_with_apple: ^5.0.0
  carousel_slider: ^5.0.0
  in_app_purchase: ^3.1.13
  lottie: ^3.1.0
  timeago: ^3.6.1
  animate_do: ^3.3.4
  in_app_purchase_storekit: ^0.3.8+1
  app_links: ^6.1.1
  camera: ^0.11.0+1
  camerawesome: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/
