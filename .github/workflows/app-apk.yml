name: TruthCatcher (clone) APK

on:
  push:
    branches: [claude/epic-bell-E1FQl]
    paths:
      - "app/**"
      - ".github/workflows/app-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Flutter 3.24 : proche de l'ère du projet d'origine (compileSdk 34,
      # gradle Groovy) -> limite les conflits avec les dépendances anciennes.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.19.6
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Régénère une plateforme Android propre autour du lib/ d'origine.
      - name: Generate android project
        run: |
          flutter create . --platforms=android --project-name truthcatcher --org com.truthcatcher
          rm -f test/widget_test.dart

      - name: Inject Android permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' "$M"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: truthcatcher-clone-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
