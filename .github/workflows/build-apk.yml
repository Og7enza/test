# =============================================================================
#  Construit automatiquement l'APK Android de Divine Rivals sur les serveurs
#  GitHub (gratuit). L'APK est ensuite téléchargeable dans l'onglet "Actions"
#  du dépôt → la run → section "Artifacts". Aucun Android Studio requis.
# =============================================================================
name: Build Android APK

on:
  push:
    branches: [ "claude/stoic-keller-zLmP2" ]
  workflow_dispatch:        # permet de lancer manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm install

      - name: Assembler le dossier web (www/)
        run: npm run build

      - name: Générer le projet Android (Capacitor)
        run: npx cap add android

      - name: Synchroniser le web dans Android
        run: npx cap sync android

      - name: Construire l'APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK en artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: divine-rivals-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
