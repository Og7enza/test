name: TruthCatcher Web (Pages)
# Redéploiement après activation de GitHub Pages.

on:
  push:
    branches: [claude/epic-bell-E1FQl]
    paths:
      - "truthcatcher/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truthcatcher
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web project
        run: flutter create . --platforms=web --project-name truthcatcher --org com.truthcatcher

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/test/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: truthcatcher/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
