name: TruthCatcher Web (Pages)

on:
  push:
    branches: [claude/epic-bell-E1FQl]
    paths:
      - "truthcatcher/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        working-directory: truthcatcher
        run: |
          flutter create . --platforms=web --project-name truthcatcher --org com.truthcatcher
          flutter pub get
          flutter build web --release --base-href "/test/"

      # Publie le site dans la branche gh-pages (pas d'environnement protege).
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./truthcatcher/build/web
          publish_branch: gh-pages
